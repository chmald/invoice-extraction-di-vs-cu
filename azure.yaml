# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# Infra-only template: `azd up` provisions the Foundry resource (Content Understanding
# + model deployments) and the Document Intelligence resource, then the postprovision
# hook writes demo-ids.local.json. The harness itself runs locally (python src/run_demo.py).
name: azure-di-vs-cu
metadata:
  template: azure-di-vs-cu@1.1.0
infra:
  provider: bicep
  path: infra
  module: azd
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
      interactive: true
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      interactive: true
      continueOnError: false
    posix:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      interactive: true
      continueOnError: false
